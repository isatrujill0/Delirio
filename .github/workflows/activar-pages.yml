# One-off helper: tries to turn on GitHub Pages (source: gh-pages branch, root) using the
# repository's own Actions token. Run it by hand from the Actions tab.
name: Activar GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a GitHub que publique la rama gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "HTTP $code"; cat out.json
          if [ "$code" = "409" ]; then echo "Pages ya estaba activado"; exit 0; fi
          [ "$code" = "201" ] || exit 1
